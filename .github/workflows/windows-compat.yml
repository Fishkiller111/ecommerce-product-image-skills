name: Windows compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Windows Server 2022 / Python 3.12
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install the three skills with the official CLI
        shell: pwsh
        env:
          DISABLE_TELEMETRY: '1'
          DO_NOT_TRACK: '1'
          PYTHONUTF8: '1'
        run: |
          $source = $env:GITHUB_WORKSPACE
          $target = Join-Path $env:RUNNER_TEMP '技能 安装 test'
          New-Item -ItemType Directory -Force $target | Out-Null
          Push-Location $target
          try {
            $cache = (npm config get cache).Trim()
            Write-Host "Node: $(node --version); npm: $(npm --version); npx: $((Get-Command npx).Source)"
            npx --yes 'skills@1.8.1' add $source --skill '*' --agent codex --copy --yes
            if ($LASTEXITCODE -ne 0) {
              $code = $LASTEXITCODE
              Get-ChildItem (Join-Path $cache '_logs') -Filter '*debug-0.log' | Sort-Object LastWriteTime -Descending | Select-Object -First 1 | Get-Content -Tail 80
              throw "skills add failed: $code"
            }
            foreach ($name in @('ai-ecommerce-product-images', 'ecommerce-template-workflow', 'psb-template-product-swap')) {
              if (!(Test-Path (Join-Path $target ".agents\skills\$name\SKILL.md"))) { throw "Missing skill $name" }
            }
            $workflow = Join-Path $target '.agents\skills\ecommerce-template-workflow'
            $protocol = Join-Path $workflow 'references\gpt-cutout.md'
            if (!(Test-Path $protocol) -or !(Test-Path (Join-Path $workflow 'scripts\composite_white.py'))) { throw "Missing workflow GPT cutout support" }
            if (-not (Select-String -Path $protocol -SimpleMatch 'v2026-11-19-gpt-cutout-1' -Quiet)) { throw "Wrong workflow GPT cutout protocol version" }
            $cutout = Join-Path $target '.agents\skills\ai-ecommerce-product-images'
            foreach ($path in @('scripts\local_product.py', 'scripts\finish_recipe.py', 'references\reference-finishing.md', 'examples\carton-2f251bc.json')) {
              if (!(Test-Path (Join-Path $cutout $path))) { throw "Missing local cutout file $path" }
            }
            $installed = Join-Path $target '.agents\skills\psb-template-product-swap'
            foreach ($path in @('requirements-windows.txt', 'scripts\platform_support.py', 'scripts\cutout_product.py', 'scripts\white_background.py')) {
              if (!(Test-Path (Join-Path $installed $path))) { throw "Missing Windows file $path" }
            }
          } finally { Pop-Location }
      - name: Install Windows dependencies
        shell: pwsh
        run: python -m pip install -r skills/psb-template-product-swap/requirements-windows.txt
      - name: Run product, font, launcher and PSB tests
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PSB_RUN_MODEL_TESTS: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s skills/psb-template-product-swap/tests -v
      - name: Test installed local cutout and workflow GPT compositing
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $target = Join-Path $env:RUNNER_TEMP '技能 安装 test'
          $localTests = Join-Path $target '.agents\skills\ai-ecommerce-product-images\tests'
          python -m unittest discover -s $localTests -v
          if ($LASTEXITCODE -ne 0) { throw "Installed local cutout tests failed" }
          $workflowTests = Join-Path $target '.agents\skills\ecommerce-template-workflow\tests'
          python -m unittest discover -s $workflowTests -p 'test_composite_white.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Installed workflow GPT compositing tests failed" }
      - name: Check installed batch launcher
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $env:PSB_PYTHON = (Get-Command python).Source
          $installed = Join-Path $env:RUNNER_TEMP '技能 安装 test\.agents\skills\psb-template-product-swap'
          & (Join-Path $installed 'run.bat') --help
          if ($LASTEXITCODE -ne 0) { throw "Installed launcher failed: $LASTEXITCODE" }
      - name: Install the public GitHub repository on Windows
        shell: pwsh
        env:
          DISABLE_TELEMETRY: '1'
          DO_NOT_TRACK: '1'
          PYTHONUTF8: '1'
        run: |
          $target = Join-Path $env:RUNNER_TEMP '仓库 安装 test'
          New-Item -ItemType Directory -Force $target | Out-Null
          Push-Location $target
          try {
            npx --yes skills add Fishkiller111/ecommerce-product-image-skills --skill '*' --agent codex --copy --yes
            if ($LASTEXITCODE -ne 0) { throw "Public npx installation failed: $LASTEXITCODE" }
            foreach ($name in @('ai-ecommerce-product-images', 'ecommerce-template-workflow', 'psb-template-product-swap')) {
              if (!(Test-Path (Join-Path $target ".agents\skills\$name\SKILL.md"))) { throw "Missing public skill $name" }
            }
            $installed = Join-Path $target '.agents\skills\psb-template-product-swap'
            $env:PSB_PYTHON = (Get-Command python).Source
            & (Join-Path $installed 'run.bat') --help
            if ($LASTEXITCODE -ne 0) { throw "Public launcher failed: $LASTEXITCODE" }
          } finally { Pop-Location }
      - name: Test PowerShell npx.cmd fallback on Windows
        shell: pwsh
        env:
          DISABLE_TELEMETRY: '1'
          DO_NOT_TRACK: '1'
        run: |
          $target = Join-Path $env:RUNNER_TEMP '命令 安装 test'
          New-Item -ItemType Directory -Force $target | Out-Null
          Push-Location $target
          try {
            npx.cmd --yes skills@1.8.1 add Fishkiller111/ecommerce-product-image-skills --skill ecommerce-template-workflow psb-template-product-swap ai-ecommerce-product-images --agent codex --copy --yes
            if ($LASTEXITCODE -ne 0) { throw "npx.cmd installation failed: $LASTEXITCODE" }
            foreach ($name in @('ai-ecommerce-product-images', 'ecommerce-template-workflow', 'psb-template-product-swap')) {
              if (!(Test-Path (Join-Path $target ".agents\skills\$name\SKILL.md"))) { throw "Missing fallback skill $name" }
            }
            $protocol = Join-Path $target '.agents\skills\ecommerce-template-workflow\references\gpt-cutout.md'
            if (!(Test-Path $protocol) -or -not (Select-String -Path $protocol -SimpleMatch 'v2026-11-19-gpt-cutout-1' -Quiet)) { throw "Public install has wrong workflow GPT cutout version" }
            $cutout = Join-Path $target '.agents\skills\ai-ecommerce-product-images'
            foreach ($path in @('scripts\local_product.py', 'scripts\finish_recipe.py', 'references\reference-finishing.md')) {
              if (!(Test-Path (Join-Path $cutout $path))) { throw "Public install is missing $path" }
            }
          } finally { Pop-Location }
